<!DOCTYPE html>
<html lang="fi">

<head>
  <!-- Sivun perustiedot -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kosteusanturi</title>

  <!-- Tyylit -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- === 1. Sivun otsikko === -->
  <div id="otsikko" class="otsikko">
    <img src="icons/leaf.svg" alt="" class="otsikkoIkoni">
    <h1>ViherVahti</h1>
  </div>

  <!-- === 2. Mittausnäkymä === -->
  <div class="kaaviot">

    <!-- Vasen laatikko: viimeisimmät mittaukset -->
    <div class="kaavioLaatikko">
      <!-- Nykyiset mittaukset -->
      <section class="nykyisetMittaukset">
        <h2>Viimeisimmät mittaukset</h2>
        <!-- Mullankosteus -->
        <div class="mittausKortti">
          <span>Mullankosteus</span>
          <strong id="arvoMullanKosteus">-- %</strong>
        </div>

        <div class="mittausKortit">
          <!-- Lämpötila -->
          <div class="mittausKortti">
            <span>Lämpötila</span>
            <strong id="arvoLampo">-- °C</strong>
          </div>

          <!-- Ilmankosteus -->
          <div class="mittausKortti">
            <span>Ilmankosteus</span>
            <strong id="arvoIlmanKosteus">-- %</strong>
          </div>

          <!-- === 3. LEDin raja-arvosäädin === -->
          <div class="mittausKortti rajaKortti">
            <label for="kosteusRajaSaadin">Mullankosteuden alaraja</label>
            <div class="kosteusRajaSaadin">
              <input type="range" min="10" max="50" value="50" class="slider" id="kosteusRajaSaadin">
              <output id="rajaArvo" for="kosteusRajaSaadin">50 %</output>
              <button id="rajaTallenna">Tallenna.</button>
            </div>
          </div>

        </div>
      </section>
    </div>

    <!-- Oikea laatikko: mittaushistoria -->
    <div class="historiaLaatikko kaavioLaatikko">
      <div class="kaavioValinnat">
        <div class="valintaRyhma">
          <!-- Mittausarvon valinta -->
          <label for="mittausValinta">Mittausarvo:</label>
          <select id="mittausValinta">
            <option value="soilMoisture_percent">Mullan kosteus (%)</option>
            <option value="temp">Lämpötila (°C)</option>
            <option value="airHumidity">Ilmankosteus (%)</option>
            <option value="soilMoisture_adc">ADC-raaka-arvo</option>
          </select>
        </div>
        <div class="valintaRyhma">
          <!-- Aikavälin valinta -->
          <label for="aikavaliValinta">Aikaväli:</label>
          <select id="aikavaliValinta">
            <option value="paiva">Päivä</option>
            <option value="kuukausi">Kuukausi</option>
            <option value="vuosi">Vuosi</option>
            <option value="kaikki">Kaikki</option>
          </select>

        </div>
      </div>
      <div class="kaavioSisalto">
        <canvas id="historiaKaavio"></canvas>
      </div>
      <!-- Historiakaavio -->
    </div>

  </div>



  <!-- === 4. Alatunniste === -->
  <footer id="footer">
    <span>© 2026 ViherVahti</span>
    <span>IoT- ja sulautetut järjestelmät</span>
  </footer>

  <!-- === 5. Skriptit: Chart.js ennen sovelluskoodia === -->
  <script src="chart/chart.js"></script><!--Paikallinen chart, muuta tarvittaessa-->
  <script src="js/script.js"></script>

</body>

</html>
